<!DOCTYPE html>
<html lang="en">
<head>
<title>TW Ops · Sign in (mockup)</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/tw-mark.svg">
<link rel="stylesheet" href="assets/styles.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.si{width:min(420px,100%);background:#fff;border-radius:26px;padding:36px 30px 28px;text-align:center;box-shadow:0 18px 50px -24px rgba(45,95,119,.55)}
.si img{height:56px;width:auto}
.si h1{margin:24px 0 6px;font-size:24px}
.si p{color:var(--muted);margin:0 0 24px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:52px;border:2px solid #cfdde4;border-radius:999px;background:#fff;padding:0 18px;font-weight:600;color:var(--ink);text-decoration:none}
.gbtn:hover{background:var(--bg)}
.gbtn svg{width:20px;height:20px}
.si .fine{font-size:14px;margin:20px 0 0}
.under{margin-top:18px;text-align:center;font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<div>
  <div class="si">
    <img src="assets/tw-logo.svg" alt="TW Orthodontics">
    <h1>Welcome to TW Ops</h1>
    <p>Sign in with the Google account you already use for work.</p>
    <a class="gbtn" href="index.html"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.5 5.8c4.4-4.1 6.8-10 6.8-17.2z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.900-6.200A24 24 0 0 0 0 24c0 3.900.900 7.500 2.600 10.800l7.900-6.200z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.900l-7.900 6.200C6.500 42.600 14.600 48 24 48z"/></svg>Sign in with Google</a>
    <p class="fine muted">Your home screen depends on your role.</p>
  </div>
  <p class="under">Mockup · sample data · the button opens the demo</p>
</div>
</body>
</html>
